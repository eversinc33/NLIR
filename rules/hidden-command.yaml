version: "1.0"
id: hidden-command
metadata:
  description: A decoded child, from any codec, directly instructs a command execution.
  author: NLIR project
  references:
    - https://github.com/Arcanum-Sec/P4RS3LT0NGV3
    - https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html
select:
  command:
    operation:
      op: EXECUTE
      polarity: positive
      imperative: true
      hypothetical: false
      conditional: false
      quoted: false
      example: false
      descriptive: false
where:
  - decoded_from: {}
  - modality:
      selector: command
      imperative: true
