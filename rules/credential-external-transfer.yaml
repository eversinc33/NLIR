version: "1.0"
id: credential-external-transfer
metadata:
  description: A skill directly sends credential or secret data to an external network destination.
  author: NLIR project
  references:
    - https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub/
    - https://labs.cloudsecurityalliance.org/research/csa-research-note-openclaw-indirect-prompt-injection-2026061/
select:
  data:
    any:
      - entity:
          type: CREDENTIAL
      - entity:
          type: SECRET
      - entity:
          type: ENVIRONMENT_VARIABLE
  destination:
    entity:
      type: NETWORK_DESTINATION
      trust: EXTERNAL
  transfer:
    any:
      - operation:
          op: SEND
          polarity: positive
      - operation:
          op: UPLOAD
          polarity: positive
where:
  - uses:
      operation: transfer
      entity: data
      role: any
  - uses:
      operation: transfer
      entity: destination
      role: any
  - modality:
      selector: transfer
      imperative: true
      hypothetical: false
      conditional: false
      quoted: false
      example: false
      descriptive: false
