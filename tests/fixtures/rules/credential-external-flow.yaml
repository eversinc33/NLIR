version: "1.0"
id: credential-external-flow
description: Credential data is sent to an external destination.
select:
  credential:
    entity:
      sensitivity: CREDENTIAL
  external:
    entity:
      trust: EXTERNAL
  transfer:
    operation:
      op: SEND
      polarity: positive
      imperative: true
      hypothetical: false
      conditional: false
      quoted: false
      example: false
      descriptive: false
where:
  - direct:
      from: credential
      to: external
      relation: SENT_TO
  - modality:
      selector: transfer
      imperative: true
